# Maps of Making's values and look on the backoffice (solid-backoffice image,
# solid-kit ADR 011). Loaded by /srv/mom-backoffice/instance-template/.env:
#   COMPOSE_FILE=compose.yml:/srv/mom-design-system/backoffice/compose.override.yml
#   DESIGN_SYSTEM=/srv/mom-design-system
# Paths go through ${DESIGN_SYSTEM}: Compose resolves relative paths from the
# checkout's folder, not from this file's. A change is a commit here, then
# `git pull` in /srv/mom-design-system and `docker compose up -d` in
# /srv/mom-backoffice/instance-template/.
services:
  web:
    volumes:
      - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/backoffice/instance.json:/usr/share/nginx/html/instance.json:ro
      - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/skins/kit/skin.css:/usr/share/nginx/html/skin.css:ro
      # The skin's url("../fonts/skin/<file>") resolves to /fonts/skin/ from /skin.css.
      - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/tokens/fonts:/usr/share/nginx/html/fonts/skin:ro
