# Maps of Making's look on the pod server (solid-css-overlay), mounted over
# the image's generic "pod" skin. Loaded by /srv/mom-pods/instance-template/.env:
#   COMPOSE_FILE=compose.yml:/srv/mom-design-system/pods/compose.override.yml
#   DESIGN_SYSTEM=/srv/mom-design-system
# Paths go through ${DESIGN_SYSTEM}: Compose resolves relative paths from the
# checkout's folder, not from this file's.
#
# A line stays commented until its file exists here: Compose mounts a missing
# path as an empty DIRECTORY, which hides the image's file. A change is a
# commit here, then `git pull` in /srv/mom-design-system and `docker compose
# up -d` in /srv/mom-pods/instance-template/.
services:
  css:
    volumes:
      - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/skins/kit/skin.css:/community-server/templates/styles/skin.css:ro
      - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/tokens/fonts:/community-server/templates/fonts/skin:ro
      # Written into the data on first start only (solid-css-overlay README,
      # "The welcome page"): pods/welcome/index.html, once it exists.
      # - ${DESIGN_SYSTEM:?set DESIGN_SYSTEM in .env}/pods/welcome/index.html:/community-server/templates/root/intro/base/index.html:ro
